<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的技能 - Skill应用商店</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --green-primary: #10B981;
            --green-hover: #059669;
            --green-light: #d1fae5;
            --green-light-bg: #ecfdf5;
            --text-primary: #171717;
            --text-secondary: #64748b;
            --text-muted: #a1a1aa;
            --border-color: #eaeaea;
            --bg-page: #fafafa;
            --bg-card: #ffffff;
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.08);
            --shadow-lg: 0 8px 24px rgba(16, 185, 129, 0.12);
            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 16px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, 'Cantarell', 'Helvetica Neue', sans-serif;
            background: var(--bg-page);
            color: var(--text-primary);
            line-height: 1.5;
            font-size: 14px;
            min-height: 100vh;
        }

        /* Top Navigation */
        .top-nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: var(--bg-card);
            border-bottom: 1px solid var(--border-color);
            z-index: 100;
            padding: 14px 0;
            box-shadow: var(--shadow-sm);
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
            text-decoration: none;
        }

        .logo-icon {
            width: 34px;
            height: 34px;
            background: linear-gradient(135deg, var(--green-primary), var(--green-hover));
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 18px;
            font-weight: 700;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .nav-link {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            padding: 8px 14px;
            border-radius: var(--radius-sm);
            transition: all 0.18s ease;
        }

        .nav-link:hover {
            color: var(--green-primary);
            background: var(--green-light-bg);
        }

        .nav-link.active {
            color: var(--green-primary);
            background: var(--green-light-bg);
        }

        /* Main Content */
        .main-content {
            padding-top: 82px;
            min-height: calc(100vh - 140px);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px;
        }

        /* Page Header */
        .page-header {
            padding: 32px 0 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px;
        }

        .page-title-section {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .page-title {
            font-size: 28px;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.5px;
        }

        .page-subtitle {
            font-size: 14px;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        .btn-upload {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 11px 20px;
            background: linear-gradient(135deg, var(--green-primary), var(--green-hover));
            color: white;
            border: none;
            border-radius: var(--radius-md);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.18s ease;
            box-shadow: 0 2px 8px rgba(16, 185, 129, 0.25);
        }

        .btn-upload:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 14px rgba(16, 185, 129, 0.35);
        }

        .btn-upload svg {
            width: 18px;
            height: 18px;
        }

        /* Filter Bar */
        .filter-bar {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 16px 20px;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            flex-wrap: wrap;
        }

        .filter-tabs {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .filter-tab {
            padding: 8px 16px;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            border-radius: var(--radius-sm);
            transition: all 0.18s ease;
            position: relative;
        }

        .filter-tab:hover {
            color: var(--green-primary);
            background: var(--green-light-bg);
        }

        .filter-tab.active {
            color: var(--green-primary);
            background: var(--green-light-bg);
        }

        .filter-tab .count {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 20px;
            height: 18px;
            padding: 0 6px;
            background: rgba(16, 185, 129, 0.15);
            border-radius: 10px;
            font-size: 11px;
            font-weight: 600;
            margin-left: 6px;
        }

        /* Search Box */
        .search-box {
            position: relative;
            width: 280px;
        }

        .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            pointer-events: none;
        }

        .search-input {
            width: 100%;
            padding: 10px 14px 10px 40px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            font-size: 14px;
            color: var(--text-primary);
            outline: none;
            transition: all 0.18s ease;
            background: var(--bg-page);
        }

        .search-input:focus {
            border-color: var(--green-primary);
            background: var(--bg-card);
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.1);
        }

        .search-input::placeholder {
            color: var(--text-muted);
        }

        /* Skills List */
        .skills-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Skill Group */
        .skill-group {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            overflow: hidden;
            transition: all 0.2s ease;
        }

        .skill-group:hover {
            border-color: var(--green-primary);
            box-shadow: var(--shadow-lg);
        }

        /* Skill Card Header */
        .skill-card-header {
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 16px;
            cursor: pointer;
            user-select: none;
        }

        .skill-icon {
            width: 52px;
            height: 52px;
            border-radius: var(--radius-md);
            background: linear-gradient(135deg, var(--green-light-bg), #f0fdf4);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            flex-shrink: 0;
        }

        .skill-info {
            flex: 1;
            min-width: 0;
        }

        .skill-name-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 6px;
        }

        .skill-name {
            font-size: 17px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .skill-badges {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .badge-status {
            background: var(--green-light-bg);
            color: var(--green-primary);
        }

        .badge-status.pending {
            background: #fef3c7;
            color: #d97706;
        }

        .badge-status.rejected {
            background: #fee2e2;
            color: #dc2626;
        }

        .badge-status.unlisted {
            background: #f3f4f6;
            color: var(--text-secondary);
        }

        .badge-active {
            background: linear-gradient(135deg, var(--green-primary), var(--green-hover));
            color: white;
        }

        .badge-default {
            background: #e0e7ff;
            color: #667eea;
        }

        .rejection-reason {
            margin-top: 8px;
            padding: 8px 12px;
            background: #fef2f2;
            border-left: 3px solid #dc2626;
            border-radius: 4px;
            font-size: 13px;
            color: #991b1b;
            line-height: 1.4;
        }

        .skill-meta {
            display: flex;
            align-items: center;
            gap: 16px;
            font-size: 13px;
            color: var(--text-secondary);
            flex-wrap: wrap;
        }

        .meta-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .meta-icon {
            font-size: 14px;
            opacity: 0.7;
        }

        /* Skill Actions */
        .skill-actions {
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }

        .btn-action {
            padding: 8px 14px;
            border: 1px solid var(--border-color);
            background: var(--bg-card);
            color: var(--text-secondary);
            border-radius: var(--radius-sm);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.18s ease;
            white-space: nowrap;
        }

        .btn-action:hover {
            border-color: var(--green-primary);
            color: var(--green-primary);
            background: var(--green-light-bg);
        }

        .btn-action.primary {
            background: var(--green-primary);
            color: white;
            border-color: var(--green-primary);
        }

        .btn-action.primary:hover {
            background: var(--green-hover);
            border-color: var(--green-hover);
        }

        .btn-action.danger:hover {
            border-color: #dc2626;
            color: #dc2626;
            background: #fee2e2;
        }

        /* Checkbox Styles */
        .skill-checkbox {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 24px;
            height: 24px;
            flex-shrink: 0;
            margin-right: 4px;
        }

        .skill-checkbox input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: var(--green-primary);
        }

        /* Batch Actions Bar */
        .batch-actions-bar {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(200%);
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 16px 24px;
            display: flex;
            align-items: center;
            gap: 20px;
            box-shadow: var(--shadow-lg);
            transition: transform 0.3s ease;
            z-index: 100;
        }

        .batch-actions-bar.show {
            transform: translateX(-50%) translateY(0);
        }

        .batch-actions-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .batch-actions-count {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .batch-actions-buttons {
            display: flex;
            gap: 10px;
        }

        .batch-actions-bar .btn-action {
            padding: 10px 18px;
            font-size: 14px;
        }

        .batch-actions-bar .btn-action.danger {
            background: #fee2e2;
            border-color: #fecaca;
            color: #dc2626;
        }

        .batch-actions-bar .btn-action.danger:hover {
            background: #dc2626;
            border-color: #dc2626;
            color: white;
        }

        /* Select All Checkbox */
        .select-all-container {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px 16px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            margin-bottom: 16px;
        }

        .select-all-container input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: var(--green-primary);
        }

        .select-all-label {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-primary);
            cursor: pointer;
        }

        /* Version List */
        .version-list {
            border-top: 1px solid var(--border-color);
            background: #fafafa;
            display: none;
        }

        .version-list.expanded {
            display: block;
        }

        .version-item {
            padding: 14px 20px;
            display: flex;
            align-items: center;
            gap: 16px;
            border-bottom: 1px solid var(--border-color);
            transition: background 0.15s ease;
        }

        .version-item:last-child {
            border-bottom: none;
        }

        .version-item:hover {
            background: white;
        }

        .version-number {
            font-family: 'SFMono-Regular', Consolas, monospace;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-primary);
            min-width: 80px;
        }

        .version-status {
            font-size: 12px;
            padding: 3px 8px;
            border-radius: 10px;
            font-weight: 500;
        }

        .version-status.active {
            background: var(--green-light-bg);
            color: var(--green-primary);
        }

        .version-status.default {
            background: #e0e7ff;
            color: #667eea;
        }

        .version-date {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .version-actions {
            margin-left: auto;
            display: flex;
            gap: 8px;
        }

        /* Expand Icon */
        .expand-icon {
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            transition: transform 0.2s ease;
        }

        .skill-card-header.expanded .expand-icon {
            transform: rotate(180deg);
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 80px 24px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
        }

        .empty-icon {
            font-size: 64px;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        .empty-state h3 {
            font-size: 20px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .empty-state p {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 20px;
        }

        /* Loading */
        .loading-state {
            text-align: center;
            padding: 60px 24px;
            color: var(--text-secondary);
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--border-color);
            border-top-color: var(--green-primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Pagination */
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            padding: 32px 0;
        }

        .page-btn {
            padding: 9px 14px;
            border-radius: var(--radius-sm);
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.18s ease;
        }

        .page-btn:hover:not(:disabled) {
            border-color: var(--green-primary);
            color: var(--green-primary);
        }

        .page-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .page-btn.active {
            background: var(--green-primary);
            color: white;
            border-color: var(--green-primary);
        }

        /* Footer */
        .footer {
            text-align: center;
            padding: 24px;
            color: var(--text-secondary);
            font-size: 13px;
            border-top: 1px solid var(--border-color);
            margin-top: 40px;
            background: var(--bg-card);
        }

        /* Toast Notification */
        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: var(--text-primary);
            color: white;
            padding: 14px 20px;
            border-radius: var(--radius-md);
            font-size: 14px;
            font-weight: 500;
            box-shadow: var(--shadow-lg);
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 1000;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        .toast.success {
            background: var(--green-primary);
        }

        .toast.error {
            background: #dc2626;
        }

        /* Confirm Dialog */
        .dialog-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.2s ease;
        }

        .dialog-overlay.show {
            opacity: 1;
            visibility: visible;
        }

        .dialog {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            padding: 24px;
            min-width: 400px;
            max-width: 90%;
            transform: scale(0.95);
            transition: transform 0.2s ease;
        }

        .dialog-overlay.show .dialog {
            transform: scale(1);
        }

        .dialog-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .dialog-content {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 20px;
        }

        .dialog-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .page-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .filter-bar {
                flex-direction: column;
                align-items: stretch;
            }

            .search-box {
                width: 100%;
            }

            .skill-card-header {
                flex-wrap: wrap;
            }

            .skill-actions {
                width: 100%;
                justify-content: flex-end;
                margin-top: 12px;
            }

            .nav-links {
                display: none;
            }
        }
    </style>
</head>
<body>
    <!-- Top Navigation -->
    <nav class="top-nav">
        <div class="nav-container">
            <a href="/" class="logo">
                <div class="logo-icon">S</div>
                <span>Skill应用商店</span>
            </a>

            <div class="nav-links">
                <a href="/" class="nav-link">首页</a>
                <a href="/my-skills" class="nav-link active">我的技能</a>
                <!-- <a href="/install-guide" class="nav-link">安装指南</a> -->
                <a href="/skill-specification" class="nav-link">技术规范</a>
                <a href="/stats" class="nav-link">下载统计</a>
                {% if user and user.role == 'admin' %}
                <a href="/admin" class="nav-link">管理后台</a>
                {% endif %}
            </div>

            <div style="display: flex; align-items: center; gap: 12px;">
                {% if user %}
                <span style="font-size: 13px; color: var(--text-secondary);">{{ user.employee_id }}</span>
                <a href="/logout" class="nav-link">退出</a>
                {% else %}
                <a href="/login" class="nav-link">登录</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
        <div class="container">
            <!-- Page Header -->
            <div class="page-header">
                <div class="page-title-section">
                    <div>
                        <h1 class="page-title">我的技能</h1>
                        <p class="page-subtitle">管理您上传的技能</p>
                    </div>
                </div>
                <a href="/upload" class="btn-upload">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
                    </svg>
                    上传新技能
                </a>
            </div>

            <!-- Filter Bar -->
            <div class="filter-bar">
                <div class="filter-tabs" id="filterTabs">
                    <button class="filter-tab active" data-status="all">
                        全部
                        <span class="count" id="count-all">0</span>
                    </button>
                    <button class="filter-tab" data-status="active">
                        已发布
                        <span class="count" id="count-active">0</span>
                    </button>
                    <button class="filter-tab" data-status="unlisted">
                        未上架
                        <span class="count" id="count-unlisted">0</span>
                    </button>
                    <button class="filter-tab" data-status="pending">
                        待审核
                        <span class="count" id="count-pending">0</span>
                    </button>
                    <button class="filter-tab" data-status="rejected">
                        已拒绝
                        <span class="count" id="count-rejected">0</span>
                    </button>
                </div>
                <div class="search-box">
                    <span class="search-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                        </svg>
                    </span>
                    <input type="text" class="search-input" id="searchInput" placeholder="搜索技能名称...">
                </div>
            </div>

            <!-- Select All -->
            <div class="select-all-container">
                <input type="checkbox" id="selectAllCheckbox" onclick="toggleAllSkills(this.checked)">
                <label class="select-all-label" for="selectAllCheckbox">全选</label>
            </div>

            <!-- Skills List -->
            <div class="skills-list" id="skillsList">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>加载中...</p>
                </div>
            </div>

            <!-- Pagination -->
            <div class="pagination" id="pagination" style="display: none;"></div>
        </div>
    </main>

    <!-- Batch Actions Bar -->
    <div class="batch-actions-bar" id="batchActionsBar">
        <div class="batch-actions-info">
            <span class="batch-actions-count">已选择 <span id="selectedCount">0</span> 个技能</span>
        </div>
        <div class="batch-actions-buttons">
            <button class="btn-action" onclick="batchUnlistSkills()">批量下架</button>
            {% if user and user.role == 'admin' %}
            <button class="btn-action danger" onclick="batchDeleteSkills()">批量删除</button>
            {% endif %}
            <button class="btn-action" onclick="cancelSelection()">取消选择</button>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <p>Skill应用商店@内部网络安全实验室</p>
    </footer>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <!-- Confirm Dialog -->
    <div class="dialog-overlay" id="confirmDialog">
        <div class="dialog">
            <h3 class="dialog-title" id="dialogTitle">确认操作</h3>
            <p class="dialog-content" id="dialogContent">确定要执行此操作吗？</p>
            <div class="dialog-actions">
                <button class="btn-action" id="dialogCancel">取消</button>
                <button class="btn-action primary" id="dialogConfirm">确认</button>
            </div>
        </div>
    </div>

    <script src="/static/js/skill-management.js?v=4"></script>
    <script>
        // Pass user role to frontend
        window.currentUserRole = '{{ user.role if user else "user" }}';
    </script>
</body>
</html>
