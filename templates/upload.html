<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>上传 Skill - Skill Registry</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --background: #fafafa;
            --foreground: #171717;
            --card: #ffffff;
            --card-foreground: #171717;
            --primary: #f97316;
            --primary-foreground: #ffffff;
            --secondary: #f5f5f5;
            --muted: #f5f5f5;
            --muted-foreground: #737373;
            --border: #171717;
            --ring: #f97316;
            --radius: 0.75rem;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, 'Cantarell', 'Helvetica Neue', sans-serif;
            background: var(--background);
            color: var(--foreground);
            line-height: 1.5;
            font-size: 14px;
        }

        /* Navbar */
        .navbar {
            background: #ffffff;
            border-bottom: 1px solid #eaeaea;
            padding: 0 24px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
        }

        .navbar-brand {
            font-size: 18px;
            font-weight: 600;
            color: #667eea;
            text-decoration: none;
        }

        .navbar-nav {
            display: flex;
            gap: 16px;
            align-items: center;
        }

        .nav-link {
            color: #2563eb;
            text-decoration: none;
            font-size: 14px;
            padding: 6px 12px;
            border-radius: 4px;
            transition: background 0.15s ease;
        }

        .nav-link:hover {
            background: #f3f4f6;
        }

        .user-info {
            font-size: 14px;
            color: #64748b;
        }

        .user-info strong {
            color: #171717;
            font-weight: 500;
        }

        /* Main Content */
        .main-content {
            padding-top: 80px;
            padding-bottom: 40px;
            max-width: 900px;
            margin: 0 auto;
            padding-left: 24px;
            padding-right: 24px;
        }

        .page-header {
            margin-bottom: 32px;
        }

        .page-title {
            font-size: 28px;
            font-weight: 600;
            color: #171717;
            margin-bottom: 8px;
        }

        .page-subtitle {
            font-size: 14px;
            color: #64748b;
        }

        /* Upload Section */
        .upload-section {
            background: #ffffff;
            border: 1px solid #eaeaea;
            border-radius: 8px;
            padding: 24px;
            margin-bottom: 32px;
        }

        .section-title {
            font-size: 18px;
            font-weight: 500;
            color: #171717;
            margin-bottom: 16px;
        }

        .upload-area {
            border: 2px dashed #d4d4d4;
            border-radius: 8px;
            padding: 48px;
            text-align: center;
            background: #fafafa;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .upload-area:hover {
            border-color: #667eea;
            background: #f5f3ff;
        }

        .upload-area.dragover {
            border-color: #667eea;
            background: #f5f3ff;
        }

        .upload-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        .upload-text {
            font-size: 16px;
            color: #171717;
            margin-bottom: 8px;
        }

        .upload-hint {
            font-size: 13px;
            color: #64748b;
        }

        .upload-button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            margin-top: 16px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .upload-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .upload-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* Selected File */
        .selected-file {
            background: #f0f9ff;
            border: 1px solid #bae6fd;
            border-radius: 6px;
            padding: 16px;
            margin-top: 16px;
            display: none;
        }

        .selected-file.show {
            display: block;
        }

        .file-name {
            font-size: 14px;
            font-weight: 500;
            color: #0369a1;
            margin-bottom: 4px;
        }

        .file-size {
            font-size: 12px;
            color: #0891b2;
        }

        /* Messages */
        .message {
            padding: 12px 16px;
            border-radius: 6px;
            margin-bottom: 24px;
            font-size: 14px;
        }

        .message.success {
            background: #f0fdf4;
            color: #166534;
            border: 1px solid #bbf7d0;
        }

        .message.error {
            background: #fef2f2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }

        .message.info {
            background: #f0f9ff;
            color: #075985;
            border: 1px solid #bae6fd;
        }

        /* Upload History */
        .history-section {
            background: #ffffff;
            border: 1px solid #eaeaea;
            border-radius: 8px;
            padding: 24px;
        }

        .history-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 16px;
        }

        .history-table th {
            padding: 12px;
            text-align: left;
            font-size: 12px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #64748b;
        }

        .history-table td {
            padding: 12px;
            border-bottom: 1px solid #eaeaea;
            font-size: 14px;
        }

        .history-table tbody tr:last-child td {
            border-bottom: none;
        }

        .history-table tbody tr:hover {
            background: #fafafa;
        }

        /* Status Badges */
        .status-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
        }

        .status-badge.pending {
            background: #fef3c7;
            color: #92400e;
        }

        .status-badge.approved {
            background: #d1fae5;
            color: #065f46;
        }

        .status-badge.rejected {
            background: #fee2e2;
            color: #991b1b;
        }

        .empty-state {
            text-align: center;
            padding: 48px 24px;
            color: #64748b;
        }

        .empty-state-text {
            font-size: 14px;
            margin-bottom: 8px;
        }

        .skill-name {
            font-weight: 500;
            color: #171717;
        }

        .skill-version {
            color: #64748b;
            font-size: 12px;
        }

        /* Source Type Section */
        .source-type-section {
            background: #f8f9ff;
            border: 1px solid #e0e7ff;
            border-radius: 8px;
            padding: 16px;
            margin-top: 16px;
        }

        .source-type-label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: #171717;
            margin-bottom: 8px;
        }

        .source-type-select {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e7ff;
            border-radius: 8px;
            font-size: 14px;
            color: #171717;
            background: #ffffff;
            cursor: pointer;
            outline: none;
            transition: all 0.2s ease;
        }

        .source-type-select:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .upload-date {
            color: #64748b;
            font-size: 13px;
        }

        /* Mode Selector Buttons */
        .mode-btn {
            flex: 1;
            padding: 12px 20px;
            border: 2px solid #e0e7ff;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .mode-btn.active {
            background: #f97316;
            color: white;
        }

        .mode-btn:not(.active) {
            background: white;
            color: #171717;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .main-content {
                padding-left: 16px;
                padding-right: 16px;
            }
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <a href="/" class="navbar-brand">Skill 应用商店</a>
        <div class="navbar-nav">
            <span class="user-info">欢迎, <strong>{{ user.employee_id }}</strong></span>
            {% if user.role == 'admin' %}
            <a href="/admin" class="nav-link">管理后台</a>
            {% endif %}
            <a href="/" class="nav-link">首页</a>
            <a href="/logout" class="nav-link">退出</a>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="main-content">
        <div class="page-header">
            <h1 class="page-title">上传 Skill</h1>
            <p class="page-subtitle">点击下方按钮前往管理上传页面进行上传操作</p>
        </div>

        {% if success %}
        <div class="message success">
            {{ success }}
        </div>
        {% endif %}

        {% if error %}
        <div class="message error">
            {{ error }}
        </div>
        {% endif %}

        <!-- Upload Redirect Card -->
        <div style="background: white; border: 2px solid #e5e5e5; border-radius: 12px; padding: 32px; text-align: center;">
            <div style="margin-bottom: 24px;">
                <div style="font-size: 48px;">📦</div>
                <h2 style="font-size: 20px; font-weight: 600; color: #171717; margin-bottom: 16px;">前往管理上传页面</h2>
            </div>
            <p style="color: #64748b; margin-bottom: 24px; line-height: 1.6;">点击下方按钮跳转到管理后台上传页面，支持单选和批量上传功能</p>
            <button onclick="window.location.href='/admin/upload'" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; padding: 16px 32px; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; width: 200px;">
                前往管理上传
            </button>
        </div>

        <!-- Upload History -->
        <div class="history-section">
            <h2 class="section-title">我的上传记录</h2>

            <div id="historyContent">
                <div class="empty-state">
                    <div class="empty-state-text">加载中...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Load upload history
        async function loadUploadHistory() {
            try {
                const response = await fetch('/api/user/uploads');
                const result = await response.json();

                if (!result.success) {
                    throw new Error('Failed to load uploads');
                }

                const uploads = result.data || [];

                if (uploads.length === 0) {
                    document.getElementById('historyContent').innerHTML = `
                        <div class="empty-state">
                            <div class="empty-state-text">暂无上传记录</div>
                        </div>
                    `;
                    return;
                }

                const table = document.createElement('table');
                table.style.cssText = 'width: 100%; border-collapse: collapse;';
                table.innerHTML = `
                    <thead>
                        <tr style="background: #f5f5f5;">
                            <th style="padding: 12px; text-align: left; font-weight: 600;">Skill 名称</th>
                            <th style="padding: 12px; text-align: left; font-weight: 600;">版本</th>
                            <th style="padding: 12px; text-align: left; font-weight: 600;">上传时间</th>
                            <th style="padding: 12px; text-align: left; font-weight: 600;">状态</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${uploads.map(upload => `
                            <tr style="border-bottom: 1px solid #e5e5e5;">
                                <td style="padding: 12px;">
                                    <div style="font-weight: 500;">${upload.skill_name}</div>
                                </td>
                                <td style="padding: 12px;">
                                    <span style="background: #f5f5f5; padding: 4px 8px; border-radius: 4px; font-size: 12px;">${upload.version}</span>
                                </td>
                                <td style="padding: 12px; color: #737373;">
                                    ${formatDate(upload.uploaded_at)}
                                </td>
                                <td style="padding: 12px;">
                                    <span style="padding: 4px 8px; border-radius: 4px; font-size: 12px; background: ${getStatusColor(upload.status)}; color: white;">
                                        ${getStatusText(upload.status)}
                                    </span>
                                </td>
                            </tr>
                        `).join('')}
                    </tbody>
                `;

                document.getElementById('historyContent').innerHTML = '';
                document.getElementById('historyContent').appendChild(table);

            } catch (error) {
                console.error('Failed to load uploads:', error);
                document.getElementById('historyContent').innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-text">加载失败</div>
                    </div>
                `;
            }
        }

        function formatDate(dateStr) {
            const date = new Date(dateStr);
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            const hours = String(date.getHours()).padStart(2, '0');
            const minutes = String(date.getMinutes()).padStart(2, '0');
            return `${year}-${month}-${day} ${hours}:${minutes}`;
        }

        function getStatusText(status) {
            const statusMap = {
                'pending': '待审核',
                'approved': '已通过',
                'rejected': '已拒绝'
            };
            return statusMap[status] || status;
        }

        function getStatusColor(status) {
            const colorMap = {
                'pending': '#f59e0b',
                'approved': '#10b981',
                'rejected': '#ef4444'
            };
            return colorMap[status] || '#737373';
        }

        // Load history on page load
        document.addEventListener('DOMContentLoaded', loadUploadHistory);
    </script>
</body>
</html>
