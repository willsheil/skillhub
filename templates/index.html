<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ registry_name }}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, 'Cantarell', 'Helvetica Neue', sans-serif;
            background: #fafafa;
            color: #171717;
            line-height: 1.5;
            font-size: 14px;
        }

        /* Sidebar */
        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            width: 220px;
            height: 100vh;
            background: #ffffff;
            border-right: 1px solid #eaeaea;
            z-index: 100;
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid #eaeaea;
        }

        .sidebar-title {
            font-size: 18px;
            font-weight: 600;
            color: #667eea;
        }

        .sidebar-nav {
            flex: 1;
            padding: 16px 0;
            overflow-y: auto;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 20px;
            color: #64748b;
            text-decoration: none;
            transition: all 0.15s ease;
            border-left: 3px solid transparent;
        }

        .nav-item:hover {
            background: #f8f9fa;
            color: #171717;
        }

        .nav-item.active {
            background: #f0f3ff;
            color: #667eea;
            border-left-color: #667eea;
        }

        .nav-icon {
            font-size: 18px;
            width: 24px;
            text-align: center;
        }

        .nav-text {
            font-size: 14px;
            font-weight: 500;
        }

        .nav-divider {
            margin: 16px 20px;
            border-top: 1px solid #eaeaea;
        }

        .nav-section-title {
            padding: 8px 20px;
            font-size: 12px;
            color: #a1a1aa;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        /* Main Content Area */
        .main-wrapper {
            margin-left: 220px;
            min-height: 100vh;
        }

        /* Fixed Header */
        .fixed-header {
            position: fixed;
            top: 0;
            left: 220px;
            right: 0;
            height: 60px;
            background: #ffffff;
            border-bottom: 1px solid #eaeaea;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            z-index: 99;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .header-title {
            font-size: 16px;
            font-weight: 500;
            color: #171717;
        }

        .header-stats {
            font-size: 14px;
            color: #64748b;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .user-welcome {
            font-size: 14px;
            color: #64748b;
        }

        .user-welcome strong {
            color: #171717;
            font-weight: 500;
        }

        .nav-link {
            color: #2563eb;
            text-decoration: none;
            font-size: 14px;
            padding: 6px 12px;
            border-radius: 4px;
            transition: background 0.15s ease;
        }

        .nav-link:hover {
            background: #f3f4f6;
        }

        .login-prompt {
            font-size: 14px;
            color: #64748b;
            padding: 6px 12px;
            background: #f3f4f6;
            border-radius: 4px;
        }

        .login-prompt a {
            color: #2563eb;
            text-decoration: none;
            font-weight: 500;
        }

        .login-prompt a:hover {
            text-decoration: underline;
        }

        /* Main Content */
        .main-content {
            padding-top: 60px;
            min-height: calc(100vh - 60px);
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 32px 24px;
        }

        /* Search Section */
        .search-section {
            background: #ffffff;
            border: 2px solid #eaeaea;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 32px;
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .search-input {
            flex: 1;
            padding: 14px 20px;
            border: 2px solid #eaeaea;
            border-radius: 12px;
            font-size: 15px;
            color: #171717;
            outline: none;
            transition: all 0.3s ease;
        }

        .search-input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        }

        .search-input::placeholder {
            color: #a1a1aa;
        }

        .sort-select, .pagesize-select {
            padding: 12px 16px;
            border: 2px solid #eaeaea;
            border-radius: 12px;
            font-size: 14px;
            color: #171717;
            background: #ffffff;
            cursor: pointer;
            outline: none;
            transition: all 0.2s ease;
        }

        .sort-select:focus, .pagesize-select:focus {
            border-color: #667eea;
        }

        .pagesize-label {
            font-size: 14px;
            color: #64748b;
            margin-right: 8px;
        }

        .btn {
            padding: 12px 20px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            border: none;
            outline: none;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #ffffff;
            color: #171717;
            border: 2px solid #eaeaea;
        }

        .btn-secondary:hover {
            background: #fafafa;
            border-color: #d4d4d4;
        }

        /* Skills Grid */
        .skills-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 24px;
            margin-bottom: 32px;
        }

        @media (max-width: 1024px) {
            .skills-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 640px) {
            .skills-grid {
                grid-template-columns: 1fr;
            }
        }

        /* Skill Card */
        .skill-card {
            background: #ffffff;
            border: 2px solid #eaeaea;
            border-radius: 16px;
            overflow: hidden;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .skill-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.1);
            border-color: #667eea;
            cursor: pointer;
        }

        /* Card Header */
        .card-header {
            padding: 20px;
            background: linear-gradient(135deg, #f8f9ff, #faf5ff);
            border-bottom: 1px solid #eaeaea;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
            min-width: 0;
        }

        .skill-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 24px;
        }

        .skill-icon img {
            width: 100%;
            height: 100%;
            border-radius: 12px;
            object-fit: cover;
        }

        .skill-info {
            flex: 1;
            min-width: 0;
        }

        .skill-title {
            font-size: 16px;
            font-weight: 600;
            color: #171717;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .skill-author {
            font-size: 13px;
            color: #64748b;
            margin-top: 2px;
        }

        /* Card Content */
        .card-content {
            padding: 20px;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .description {
            color: #64748b;
            font-size: 14px;
            line-height: 1.6;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
            min-height: 44px;
        }

        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .tag {
            padding: 4px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 500;
        }

        /* Card Footer */
        .card-footer {
            padding: 16px 20px;
            background: #fafafa;
            border-top: 1px solid #eaeaea;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .footer-left {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #64748b;
            font-size: 13px;
        }

        .download-icon {
            font-size: 18px;
            font-weight: bold;
            color: #667eea;
        }

        .download-count {
            font-weight: 500;
        }

        .footer-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .download-btn, .version-badge {
            background: #f3f4f6;
            color: #64748b;
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            text-decoration: none;
            transition: all 0.2s ease;
            display: inline-block;
        }

        .download-btn:hover {
            background: #e5e7eb;
            color: #171717;
        }

        /* Pagination */
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            margin-top: 40px;
            padding: 24px 0;
        }

        .pagination-info {
            font-size: 14px;
            color: #64748b;
        }

        .pagination-controls {
            display: flex;
            gap: 8px;
        }

        .page-btn {
            padding: 10px 18px;
            background: white;
            border: 2px solid #eaeaea;
            border-radius: 8px;
            color: #171717;
            font-size: 14px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .page-btn:hover:not(:disabled) {
            border-color: #667eea;
            color: #667eea;
        }

        .page-btn:disabled {
            color: #d4d4d4;
            cursor: not-allowed;
            opacity: 0.5;
        }

        .page-btn.current {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border-color: transparent;
        }

        /* Empty State */
        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 80px 24px;
            color: #64748b;
        }

        .empty-state .empty-icon {
            font-size: 64px;
            margin-bottom: 16px;
        }

        .empty-state h2 {
            font-size: 20px;
            font-weight: 500;
            color: #171717;
            margin-bottom: 8px;
        }

        .empty-state p {
            font-size: 14px;
            color: #64748b;
        }

        .empty-state a {
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
        }

        .empty-state a:hover {
            text-decoration: underline;
        }

        /* Loading State */
        .loading {
            grid-column: 1 / -1;
            text-align: center;
            padding: 80px 24px;
            color: #64748b;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #eaeaea;
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Footer */
        .footer {
            text-align: center;
            padding: 24px;
            color: #64748b;
            font-size: 13px;
            margin-top: 40px;
        }

        .footer a {
            color: #667eea;
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .sidebar {
                transform: translateX(-100%);
                transition: transform 0.3s ease;
            }

            .sidebar.open {
                transform: translateX(0);
            }

            .main-wrapper {
                margin-left: 0;
            }

            .fixed-header {
                left: 0;
            }

            .search-section {
                flex-direction: column;
                align-items: stretch;
            }

            .sort-select, .pagesize-select {
                width: 100%;
            }

            .card-header {
                padding: 16px;
            }

            .card-content {
                padding: 16px;
            }

            .card-footer {
                padding: 12px 16px;
            }
        }
    </style>
</head>
<body>
    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-title">Skill应用商店</div>
        </div>

        <nav class="sidebar-nav">
            <a href="/" class="nav-item active">
                <span class="nav-icon">🏠</span>
                <span class="nav-text">首页</span>
            </a>

            <a href="/install-guide" class="nav-item">
                <span class="nav-icon">📋</span>
                <span class="nav-text">安装指南</span>
            </a>

            <a href="/stats" class="nav-item">
                <span class="nav-icon">📊</span>
                <span class="nav-text">下载统计</span>
            </a>

            <div class="nav-divider"></div>

            <div class="nav-section-title">管理</div>

            <a href="/admin/upload" class="nav-item">
                <span class="nav-icon">⬆️</span>
                <span class="nav-text">上传 Skill</span>
            </a>
        </nav>
    </aside>

    <!-- Main Wrapper -->
    <div class="main-wrapper">
        <!-- Fixed Header -->
        <div class="fixed-header">
            <div class="header-left">
                <div class="header-title">技能列表</div>
                <div class="header-stats">
                    <span id="headerStats">{{ plugin_count }} 个技能</span>
                </div>
            </div>
            <div class="header-right">
                {% if user %}
                <div class="user-info">
                    <span class="user-welcome">欢迎, <strong>{{ user.employee_id }}</strong></span>
                    {% if user.role == 'admin' %}
                    <a href="/admin" class="nav-link">管理后台</a>
                    {% endif %}
                    <a href="/upload" class="nav-link">上传</a>
                    <a href="/logout" class="nav-link">退出</a>
                </div>
                {% else %}
                <div class="login-prompt">
                    <a href="/login">登录后下载</a>
                </div>
                {% endif %}
            </div>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <div class="container">
                <!-- Search Section -->
                <div class="search-section">
                    <input type="text"
                           class="search-input"
                           id="searchInput"
                           placeholder="搜索技能名称、描述、作者..."
                           oninput="handleSearch()">
                    <select class="sort-select" id="sortSelect" onchange="handleSort()">
                        <option value="upload_time_desc">上传时间 ↓</option>
                        <option value="upload_time_asc">上传时间 ↑</option>
                        <option value="downloads_desc">下载次数 ↓</option>
                        <option value="downloads_asc">下载次数 ↑</option>
                        <option value="name_asc">名称 A-Z</option>
                        <option value="name_desc">名称 Z-A</option>
                    </select>
                    <div style="display: flex; align-items: center; gap: 8px;">
                        <span class="pagesize-label">每页</span>
                        <select class="pagesize-select" id="pageSizeSelect" onchange="handlePageSizeChange()">
                            <option value="12" selected>12条</option>
                            <option value="24">24条</option>
                            <option value="48">48条</option>
                        </select>
                    </div>
                    <button class="btn btn-secondary" onclick="clearSearch()">清除</button>
                </div>

                <!-- Skills Grid -->
                <div class="skills-grid" id="skillsGrid">
                    <!-- Skills will be loaded via JavaScript -->
                </div>

                <!-- Pagination -->
                <div class="pagination" id="pagination">
                    <div class="pagination-info" id="paginationInfo">
                        显示 1-12 / 共 24 个技能
                    </div>
                    <div class="pagination-controls" id="paginationControls">
                        <!-- Pagination buttons will be added via JavaScript -->
                    </div>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <footer class="footer">
            <p>Skill应用商店@内部网络安全实验室</p>
        </footer>
    </div>

    <script>
        // State
        let allSkills = [];
        let filteredSkills = [];
        let currentPage = 1;
        let pageSize = 12;  // 默认每页12条（3列 x 4行）
        let downloadStats = {};
        let currentSort = { field: 'upload_time', order: 'desc' };

        // Load skills on page load
        window.addEventListener('DOMContentLoaded', async () => {
            // Initialize page size select
            document.getElementById('pageSizeSelect').value = pageSize.toString();
            await loadData();
        });

        // Load skills and download stats
        async function loadData() {
            try {
                // Load skills
                const skillsResponse = await fetch('/api/skills?page=1&per_page=1000');
                const skillsResult = await skillsResponse.json();
                allSkills = skillsResult.data || [];

                // Load download stats
                const statsResponse = await fetch('/api/stats/top');
                const statsResult = await statsResponse.json();

                // Build download count map
                downloadStats = {};
                if (statsResult.rankings) {
                    statsResult.rankings.forEach(item => {
                        downloadStats[item.skill_name] = item.downloads;
                    });
                }

                // Add download counts to skills
                allSkills.forEach(skill => {
                    skill.download_count = downloadStats[skill.name] || 0;
                });

                // Sort by default (upload time desc)
                sortSkills();
                filteredSkills = [...allSkills];

                renderCards();
                updatePagination();
            } catch (error) {
                console.error('Failed to load data:', error);
                showError();
            }
        }

        // Generate tags based on skill description
        function generateTags(skill) {
            const tags = [];
            const desc = (skill.metadata?.description || '').toLowerCase();

            // Generate tags based on keywords
            if (desc.includes('效率') || desc.includes('自动') || desc.includes('快捷')) {
                tags.push({ text: '效率类', color: '#3b82f6' });
            } else if (desc.includes('分析') || desc.includes('统计') || desc.includes('数据')) {
                tags.push({ text: '分析类', color: '#8b5cf6' });
            } else if (desc.includes('工具') || desc.includes('实用')) {
                tags.push({ text: '工具类', color: '#10b981' });
            } else if (desc.includes('安全') || desc.includes('测试') || desc.includes('检测')) {
                tags.push({ text: '安全类', color: '#f59e0b' });
            } else if (desc.includes('AI') || desc.includes('智能') || desc.includes('机器学习')) {
                tags.push({ text: 'AI类', color: '#ec4899' });
            } else {
                tags.push({ text: '通用', color: '#64748b' });
            }

            // Limit to 3 tags
            return tags.slice(0, 3).map(tag =>
                `<span class="tag" style="background: ${tag.color}20; color: ${tag.color}">
                    ${tag.text}
                </span>`
            ).join('');
        }

        // Generate skill icon emoji based on name
        function generateSkillIcon(skill) {
            const name = (skill.metadata?.name || skill.name).toLowerCase();

            if (name.includes('代码') || name.includes('code')) return '💻';
            if (name.includes('安全') || name.includes('security')) return '🔒';
            if (name.includes('分析') || name.includes('analysis')) return '📊';
            if (name.includes('搜索') || name.includes('search')) return '🔍';
            if (name.includes('效率') || name.includes('productivity')) return '⚡';
            if (name.includes('AI') || name.includes('智能')) return '🤖';
            if (name.includes('文件') || name.includes('file')) return '📁';
            if (name.includes('网络') || name.includes('network')) return '🌐';
            if (name.includes('测试') || name.includes('test')) return '🧪';
            if (name.includes('工具') || name.includes('tool')) return '🛠️';

            return '📦'; // Default icon
        }

        // Get author name from skill metadata
        function getAuthorName(skill) {
            const author = skill.metadata?.metadata?.author;
            if (typeof author === 'object' && author !== null) {
                return author.name || '未知';
            }
            return author || '未知';
        }

        // Generate card HTML for a skill
        function generateCardHTML(skill) {
            const icon = generateSkillIcon(skill);
            const tags = generateTags(skill);
            const author = getAuthorName(skill);
            const latestVersion = skill.versions && skill.versions.length > 0 ? skill.versions[0] : null;

            return `
                <div class="card-header">
                    <div class="header-left">
                        <div class="skill-icon">${icon}</div>
                        <div class="skill-info">
                            <div class="skill-title" title="${skill.metadata?.name || skill.name}">${skill.metadata?.name || skill.name}</div>
                            <div class="skill-author">by ${author}</div>
                        </div>
                    </div>
                </div>
                <div class="card-content">
                    <div class="description" title="${skill.metadata?.description || '暂无描述'}">${skill.metadata?.description || '暂无描述'}</div>
                    <div class="tags">${tags}</div>
                </div>
                <div class="card-footer">
                    <div class="footer-left">
                        <span class="download-icon">⬇</span>
                        <span class="download-count">${skill.download_count || 0}</span>
                    </div>
                    <div class="footer-right">
                        ${latestVersion ? `
                            <a href="/plugins/${latestVersion.filename}" class="download-btn" download>下载</a>
                            <span class="version-badge">v${skill.latest_version}</span>
                        ` : '<span style="color: #ef4444;">无可用版本</span>'}
                    </div>
                </div>
            `;
        }

        // Sort skills based on current sort settings
        function sortSkills() {
            const { field, order } = currentSort;
            const multiplier = order === 'asc' ? 1 : -1;

            allSkills.sort((a, b) => {
                let valA, valB;

                switch (field) {
                    case 'upload_time':
                        valA = a.versions && a.versions.length > 0 ?
                            new Date(a.versions[a.versions.length - 1].updated_at) : new Date(0);
                        valB = b.versions && b.versions.length > 0 ?
                            new Date(b.versions[b.versions.length - 1].updated_at) : new Date(0);
                        break;
                    case 'downloads':
                        valA = a.download_count || 0;
                        valB = b.download_count || 0;
                        break;
                    case 'name':
                        valA = (a.metadata?.name || a.name).toLowerCase();
                        valB = (b.metadata?.name || b.name).toLowerCase();
                        break;
                    default:
                        return 0;
                }

                if (valA < valB) return -1 * multiplier;
                if (valA > valB) return 1 * multiplier;
                return 0;
            });
        }

        // Handle sort select change
        function handleSort() {
            const value = document.getElementById('sortSelect').value;
            const [field, order] = value.split('_');
            currentSort = { field, order };

            sortSkills();

            // Re-apply search filter
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            if (query) {
                filterSkills(query);
            } else {
                filteredSkills = [...allSkills];
            }

            currentPage = 1;
            renderCards();
            updatePagination();
        }

        // Filter skills based on search query
        function filterSkills(query) {
            filteredSkills = allSkills.filter(skill => {
                const name = (skill.metadata?.name || skill.name).toLowerCase();
                const description = (skill.metadata?.description || '').toLowerCase();
                const author = (skill.metadata?.metadata?.author || '').toLowerCase();

                return name.includes(query) ||
                       description.includes(query) ||
                       author.includes(query);
            });
        }

        // Render skills cards
        function renderCards() {
            const grid = document.getElementById('skillsGrid');
            const start = (currentPage - 1) * pageSize;
            const end = Math.min(start + pageSize, filteredSkills.length);
            const pageSkills = filteredSkills.slice(start, end);

            if (pageSkills.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">🔍</div>
                        <h2>未找到技能</h2>
                        <p>请调整搜索条件或<a href="#" onclick="location.reload()">刷新页面</a></p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = pageSkills.map(skill => `
                <div class="skill-card" data-skill-id="${skill.name}" style="cursor: pointer;">
                    ${generateCardHTML(skill)}
                </div>
            `).join('');

            // Add click handlers to skill cards
            document.querySelectorAll('.skill-card').forEach(card => {
                card.addEventListener('click', (e) => {
                    // Don't navigate if clicking on download button or link
                    if (e.target.closest('a') || e.target.closest('.download-btn')) {
                        return;
                    }
                    const skillName = card.dataset.skillId;
                    window.location.href = `/skill/${encodeURIComponent(skillName)}`;
                });
            });

            // Update header stats
            document.getElementById('headerStats').textContent = `${allSkills.length} 个技能`;
        }

        // Pagination
        function updatePagination() {
            const totalPages = Math.ceil(filteredSkills.length / pageSize);
            const start = (currentPage - 1) * pageSize + 1;
            const end = Math.min(currentPage * pageSize, filteredSkills.length);

            document.getElementById('paginationInfo').textContent =
                `显示 ${start}-${end} / 共 ${filteredSkills.length} 个技能`;

            const controls = document.getElementById('paginationControls');

            let buttons = '';

            // Previous button
            buttons += `
                <button class="page-btn" ${currentPage === 1 ? 'disabled' : ''}
                        onclick="${currentPage > 1 ? `goToPage(${currentPage - 1})` : ''}">
                    上一页
                </button>
            `;

            // Page numbers
            const maxVisiblePages = 5;
            let startPage = Math.max(1, currentPage - Math.floor(maxVisiblePages / 2));
            let endPage = Math.min(totalPages, startPage + maxVisiblePages - 1);

            if (endPage - startPage + 1 < maxVisiblePages) {
                startPage = Math.max(1, endPage - maxVisiblePages + 1);
            }

            for (let i = startPage; i <= endPage; i++) {
                if (i === currentPage) {
                    buttons += `<button class="page-btn current">${i}</button>`;
                } else {
                    buttons += `<button class="page-btn" onclick="goToPage(${i})">${i}</button>`;
                }
            }

            // Next button
            buttons += `
                <button class="page-btn" ${currentPage >= totalPages ? 'disabled' : ''}
                        onclick="${currentPage < totalPages ? `goToPage(${currentPage + 1})` : ''}">
                    下一页
                </button>
            `;

            controls.innerHTML = buttons;
        }

        function goToPage(page) {
            currentPage = page;
            renderCards();
            updatePagination();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Search
        function handleSearch() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();

            if (!query) {
                filteredSkills = [...allSkills];
            } else {
                filterSkills(query);
            }

            currentPage = 1;
            renderCards();
            updatePagination();
        }

        function clearSearch() {
            document.getElementById('searchInput').value = '';
            filteredSkills = [...allSkills];
            currentPage = 1;
            renderCards();
            updatePagination();
        }

        // Handle page size change
        function handlePageSizeChange() {
            const newSize = parseInt(document.getElementById('pageSizeSelect').value);
            pageSize = newSize;

            // Recalculate current page to avoid going out of bounds
            const totalPages = Math.ceil(filteredSkills.length / pageSize);
            if (currentPage > totalPages) {
                currentPage = Math.max(1, totalPages);
            }

            renderCards();
            updatePagination();
        }

        // Show error
        function showError() {
            document.getElementById('skillsGrid').innerHTML = `
                <div class="empty-state">
                    <div class="empty-icon">⚠️</div>
                    <h2>加载失败</h2>
                    <p>请刷新页面重试</p>
                    <button class="btn btn-primary" onclick="location.reload()">刷新页面</button>
                </div>
            `;
        }
    </script>
</body>
</html>
